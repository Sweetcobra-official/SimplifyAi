name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run TypeScript typecheck
        run: npm run lint

  build-and-smoke-test:
    name: Build & Smoke Test
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build production bundles
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/index.html || (echo "dist/index.html not found" && exit 1)
          test -f dist/server.cjs || (echo "dist/server.cjs not found" && exit 1)
          echo "Production build artifacts verified successfully."

      - name: Smoke test production server
        env:
          IO_INTELLIGENCE_API_KEY: ${{ secrets.IO_INTELLIGENCE_API_KEY || 'dummy-test-key-for-ci' }}
          NODE_ENV: "production"
        run: |
          node dist/server.cjs &
          SERVER_PID=$!
          
          # Wait up to 20 seconds for the server to be ready
          for i in {1..20}; do
            if curl -s http://127.0.0.1:3000/api/models > /dev/null || curl -s http://localhost:3000/api/models > /dev/null; then
              echo "Server is healthy and responding to /api/models!"
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done

          echo "Server failed to respond within 20 seconds"
          kill $SERVER_PID 2>/dev/null || true
          exit 1
